<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 容器屏整稿，文档逻辑尺寸钉死 620×760（《AUI使用总结》§13.3）。
     高度 760 这个数不是估的：面板 520 宽 / 内容实测 ≈715 高（6 行仓库 + 4 行行囊
     + 两处标签 + 标题），再算上 body 的 20px 内边距——文档尺寸给不够就是整页被裁。
     scale=fit（与 backpack.html / city_hall.html 同一套结论）：倍率交给
     min(GUI宽÷620, GUI高÷760)，窗口一变就重算，整稿等比放进视口。
     旧值 0.4864 是**绝对倍率**——窗口缩小它不变（不缩放），而居中偏移按视口算 ⇒ 偏移失义；
     旧注释里"620×760 × 0.4864 ≈ 302×370，比背包页小所以一定装得下"只在大窗口下成立。
     zoom 钉死 1：倍率归 fit 决定，zoom 在 fit 下只改逻辑坐标精度、不改变实际显示大小。
     本页**故意不写** aui-mouse-events=intercept（§0 铁律 5）：
     它会吃掉原生点击 → 槽位全部点不动。本页没有 DOM 点击元素，裸奔即可。 -->
<meta name="aui-viewport" content="mode=fixed,width=620,height=760,scale=fit,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
<title>建筑仓库</title>
<style>
@font-face{
  font-family:'Zpix';
  src:url('/font/zpix.ttf') format('truetype');
  font-display:block;
}

:root{
  --parchment:#c8ac7c;
  --parchment-lo:#b89868;
  --parchment-hi:#d6bb8c;
  --border-mid:#6a4a20;
  --border-dark:#4a3218;
  --border-deep:#3a2814;
  --border-light:#8a6e3c;
  --border-hi:#d8bc8c;
  --ink:#1a0e04;
  --ink-2:#4a3218;
  --gold:#c9a227;
  --gold-l:#f5e08a;
}

*{box-sizing:border-box;margin:0;padding:0;
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:unset;font-smooth:never;
  text-rendering:geometricPrecision;
  font-feature-settings:"kern" 0,"liga" 0,"calt" 0;font-variant-ligatures:none;}

html,body{overflow-x:hidden;overflow-y:hidden;}

body{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  /* 原稿的深色底是给浏览器看的；游戏里容器屏自带压暗，透明让世界透出来，
     否则文档矩形整块发黑（§13.7） */
  background-color:transparent;
  font-family:'Zpix',monospace;
  font-size:13px;
  color:var(--ink);
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}

canvas,img{
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}

/* ============================================================
   面板：pane 贴图 + 四色环边框（与背包页同一套视觉语言，§13.2）
   ============================================================ */
.storage-panel{
  width:520px;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:12px 12px 14px;
  background-color:var(--parchment);
  background-image:url('/tex/pane_gen.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  border:3px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 0 0 1px var(--border-light),
    inset 2px 2px 0 0 var(--border-hi),
    inset -2px -2px 0 0 var(--border-mid),
    4px 4px 0 0 rgba(0,0,0,.45);
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1px 2px 6px;
  border-bottom:2px solid var(--border-mid);
  box-shadow:0 1px 0 rgba(255,240,200,.38);
}

.panel-title{
  font-size:14px;
  line-height:18px;
  letter-spacing:2px;
  color:var(--gold);
  text-stroke:1px var(--border-deep);
}

.panel-meta{
  font-size:12px;
  line-height:18px;
  color:var(--ink-2);
}

.section-label{
  font-size:12px;
  line-height:14px;
  letter-spacing:1px;
  color:var(--ink-2);
  padding-left:2px;
}

/* ============================================================
   槽位阵列：**直接照抄背包页 #player 的写法**（§13.8）
   · grid-template-columns 写**整数 = 列数**，不是标准的 repeat(9,48px)——
     AUI 的 grid 只认前者（ContainerExpander 自己注入的也是整数形式）。
     写成 repeat() 会让行高塌陷，只剩几个格子渲染。
   · 槽位必须是 <container> 的**直接子元素**（官方文档明写"手写 slot 也必须是直接子元素"）。
   · 间距交给 grid 的 gap（AUI 的 grid gap 可用，§13.5 的例外）；
     槽位自身的 margin 必须清零，否则会被算进列宽/行高。
   ============================================================ */
.slot-grid{
  display:grid;
  grid-template-columns:9;
  gap:8px;
  width:496px;
}

.slot{
  position:relative;
  flex:0 0 auto;
  width:48px;
  height:48px;
  /* AUI 的 UA 样式表给所有 slot 默认 --aui-slot-size:18（原版槽位尺寸），
     而它是**热区判定的第一优先级**，不覆盖会把点击热区压成 18px（§11 坑 28） */
  --aui-slot-size:48;
  /* 图标缩放：slot_gen.png 是 32×32、四边各 3px 边框，48px 槽位内框约 39px；
     16×2.25 = 36px 正好落在内框里（§11 坑 31） */
  --aui-slot-icon-scale:2.25;
  margin-right:0;
  margin-bottom:0;
  background-color:#d8c090;
  background-image:url('/tex/slot_gen.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  cursor:pointer;
}

/* 超出本建筑可用容量的格子：由 Java 在打开时按 capacity 打上这个类。
   用 visibility 而不是 display:none —— 格子仍占位，网格不会被抽掉几格而错行。 */
.slot.is-off{
  visibility:hidden;
}

/* 槽位里的 <item> 必须自己铺满槽位盒子：AUI 的物品居中用的是 <item> 自身矩形，
   而 UA 样式表把它定死 16×16 且定位在 slot 的 left/top:1px——
   不铺满的话，放大后的图标会以"格子左上角"为中心撑出去（§11 坑 31）。
   position:absolute 显式写，不依赖 UA 的 slot > item 标签选择器。 */
.slot-icon{
  position:absolute;
  left:0;
  top:0;
  width:48px;
  height:48px;
}

.divider{
  height:0;
  border-top:2px solid var(--border-mid);
  box-shadow:0 1px 0 rgba(255,240,200,.30);
}
</style>
</head>
