<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="aui-viewport" content="mode=gui,min-zoom=0.5,max-zoom=3,user-scalable=true">
<meta name="aui-mouse-events" content="intercept">
<title>雇佣市民</title>
<style>
@font-face{
  font-family:'Zpix';
  src:url('/font/zpix.ttf') format('truetype');
  font-display:block;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:transparent;}
:root{
  --parchment:#c8ac7c;
  --pane:#d6bc94;
  --border-mid:#6a4a20;
  --border-dark:#4a3218;
  --border-deep:#2a1a08;
  --border-hi:#d8bc8c;
  --ink:#1a0e04;
  --ink-2:#4a3218;
  --gold:#c9a227;
  --gold-l:#f5e08a;
}
body{font-family:'Zpix',monospace;font-size:12px;color:var(--ink);}
#ep-root{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(8,6,4,.55);
}
#ep-panel{
  width:56%;height:70%;
  display:flex;flex-direction:column;
  padding:8px;
  background:var(--parchment);
  border:3px solid var(--border-deep);
  box-shadow:0 0 0 2px var(--border-hi) inset,0 6px 18px rgba(0,0,0,.5);
}
#ep-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 4px 6px;
  border-bottom:2px solid var(--border-dark);
}
#ep-title{font-size:14px;letter-spacing:1px;}
#ep-limit{color:var(--ink-2);}
#ep-search{
  margin:6px 2px;
  height:20px;
  padding:0 6px;
  font-family:inherit;font-size:12px;color:var(--ink);
  background:var(--pane);
  border:2px solid var(--border-dark);
  outline:none;
}
#ep-grid{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:6px;
  padding:2px;
}
.ep-card{
  display:flex;align-items:center;gap:6px;
  min-width:0;min-height:0;
  padding:4px;
  background:var(--pane);
  border:2px solid var(--border-mid);
  cursor:pointer;
  overflow:hidden;
}
.ep-card.on{
  border-color:var(--gold);
  box-shadow:0 0 0 2px var(--gold-l) inset;
  background:#e2cc9e;
}
.ep-card.busy{opacity:.55;}
.ep-face{
  display:block;
  flex:0 0 48px;
  width:48px;
  height:48px;
  image-rendering:pixelated;
}
.ep-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ep-name,.ep-job{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%;
}
.ep-job{color:var(--ink-2);font-size:11px;}
.ep-fire{
  flex:0 0 16px;width:16px;height:16px;line-height:12px;text-align:center;
  color:#ffffff;background:#a8271c;
  border:2px solid #6d140c;
  cursor:pointer;
}
.ep-fire:hover{background:#c93224;}
#ep-pager{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;
}
.ep-pg{
  min-width:22px;height:20px;line-height:16px;text-align:center;
  padding:0 6px;
  background:var(--pane);
  border:2px solid var(--border-mid);
  cursor:pointer;
}
.ep-pg:hover{border-color:var(--gold);}
#ep-page{
  width:40px;height:20px;text-align:center;
  font-family:inherit;font-size:12px;color:var(--ink);
  background:var(--pane);
  border:2px solid var(--gold);
  outline:none;
}
#ep-pages{color:var(--ink-2);}
#ep-hint{
  min-height:14px;text-align:center;color:#7a2a12;
  margin-top:4px;
}
#ep-foot{
  display:flex;justify-content:space-between;
  width:56%;
  margin-top:8px;
}
.ep-btn{
  width:46%;
  height:24px;line-height:18px;text-align:center;
  background:var(--pane);
  border:2px solid var(--border-dark);
  cursor:pointer;
}
.ep-btn.ep-primary{background:#d9c08a;border-color:var(--gold);}
.ep-btn:hover{border-color:var(--gold);}
.ep-empty{
  grid-column:1 / -1;
  text-align:center;color:var(--ink-2);
  padding-top:16px;
}
</style>
</head>
<body>
<div id="ep-root">
  <div id="ep-panel">
    <div id="ep-head">
      <div id="ep-title">雇佣市民</div>
      <div id="ep-limit">上限 0</div>
    </div>
    <input id="ep-search" placeholder="搜索姓名">
    <div id="ep-grid"></div>
    <div id="ep-pager">
      <div class="ep-pg" id="ep-prev">‹</div>
      <input id="ep-page" value="1">
      <span id="ep-pages">/ 1</span>
      <div class="ep-pg" id="ep-next">›</div>
    </div>
    <div id="ep-hint"></div>
  </div>
  <div id="ep-foot">
    <div class="ep-btn" id="ep-cancel">取消</div>
    <div class="ep-btn ep-primary" id="ep-confirm">雇佣</div>
  </div>
</div>
</body>
</html>
