<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 纯 DOM 页的居中靠**成对的两个 mixin**完成（这正是 backpack 一直正常的原因）：
     · AuiDocumentCenterMixin（注 Document.applyViewport）把居中偏移写进 Document.viewportTransform
       —— **只有输入映射消费它**（screenToDocumentPosition / tooltip / 点击热区）；
     · AuiScreenDocCenterMixin（注 ApricityScreen.render，kingdom 照容器页那套补出来的）
       在绘制前后成对 translate **同一个偏移** —— 画面这才跟着走。
     两者一致后，mode=fixed + scale 在纯 DOM 页上也能正确居中，点击与画面不再错位。
     （容器页一直有对应的 AuiContainerDocCenterMixin，所以 backpack.html 从来不出这个问题；
     从前纯 DOM 页缺第二个 mixin，一加偏移就变成"画面钉左上、点击按居中算"。）
     · width/height 是文档逻辑尺寸 1124×854 = 面板 1080×810 + 四周 22px；
     · scale=0.45 把它缩到约 506×384 GUI px。缩放后文档必须**小于视口**，
       mixin 的「已占满视口就不动」短路才不会命中——0.45 对常见视口都留有余量。
     zoom 钉死 1（铁律 1）：像素字体被非整数缩放会糊。 -->
<meta name="aui-viewport" content="mode=fixed,width=1124,height=854,scale=0.45,zoom=1,min-zoom=1,max-zoom=1,user-scalable=false">
<!-- 纯 DOM 页（没有任何真实槽位），必须写 intercept，否则输入框与按钮点不动。
     有真实槽位的容器页绝不能写这条（§11 坑 32）。 -->
<meta name="aui-mouse-events" content="intercept">
<title>市政厅 · 像素中世纪</title>
<style>
/*
  AUI 版。版式逐条照 assets/原始html/city_hall.html，只做 AUI 跑不了的等价替换，
  每处替换都在注释里标了原写法与理由：

  【替换 1】贴图不再由页内 JS 生成（AUI 跑不了 JS），改用它生成的预生成 PNG：
           --panel-bg  buildCardGrid(180,135)  → /tex/card_gen.png
           --pane-bg   buildPaneGrid(48,102)   → /tex/pane_v.png
           --card-bg   buildSmall(48,20,.80,21)→ /tex/card_small.png
           三张都按原稿算法逐像素生成，比例与原稿一致，拉伸不失真。
  【替换 2】能量条 <canvas> + drawBar → <npc-bar>（格子画法与原稿同源，见 NpcBarElement）
  【替换 3】头像 <canvas> → <kingdom-entity-avatar skin>
  【替换 4】地图 <canvas> → <world-map center-x center-z radius>
  【替换 5】整块 <script> 删除；文字不再栅格化（Zpix 本身是像素字体）；
           弹窗/列表/日期的内容改由 Java 通过 DOM 填，页面只留结构与 id。
  【替换 6】aspect-ratio:4/3 → 精确 height:810px（AUI 不实现 aspect-ratio）
  【替换 7】min(1080px,96vw,125vh) → width:1080px（AUI 的 min()/vw/vh 不可靠）
  【替换 8】flex 的 gap → 子元素 margin（AUI 的 flex gap 行为不一致）
  【替换 9】em 字距 → px（AUI 的 em 参与测量循环）
  【替换 10】grid 等分三栏 → flex:1 1 0（AUI 的 grid 分栏比例不可靠）
  【替换 11】align-items:baseline → center（AUI 容器页禁用 baseline）
  【替换 12】min(560px,84%) / 72% → 固定 560×420（AUI 不支持 %）
*/

@font-face{
  font-family:'Zpix';
  src:url('/font/zpix.ttf') format('truetype');
  font-display:block;
}

:root{
  --parchment:#c8ac7c;
  --parchment-lo:#b89868;
  --parchment-hi:#d6bc94;
  --border-mid:#6a4a20;
  --border-dark:#4a3218;
  --border-deep:#3a2814;
  --border-light:#8a6e3c;
  --border-hi:#d8bc8c;
  --ink:#1a0e04;
  --ink-2:#4a3218;
  --gold:#c9a227;
  --gold-l:#f5e08a;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-font-smoothing:none;
  -moz-osx-font-smoothing:unset;
  font-smooth:never;
  text-rendering:geometricPrecision;
  font-feature-settings:"kern" 0, "liga" 0, "calt" 0;
  font-variant-ligatures:none;
}

/* 这里**不能设裁剪属性**（《AUI使用总结》§0 铁律 6）：
   空流文档的根元素盒子高为 0，一旦设了它就会生成一个错误尺寸的裁剪遮罩，
   把页面节点静默削掉——左下角边框整块缺一半就是这个遮罩干的。
   原来的浏览器稿有这一行，搬到 AUI 时必须删。 */

/* identify.html（已核实的纯 DOM 页）给 html/body 定了高：
   没有确定高度的 flex 居中在纵向上不生效，而空流文档的根盒子高为 0。 */
html,body{height:100%;}

body{
  /* 原稿是深色径向渐变底，那是给浏览器看的；
     游戏里容器屏自带压暗，透明让世界透出来，
     否则文档矩形会整块发黑（"部分黑屏"）。【替换：原 background 为渐变+#0a0604】 */
  background-color:transparent;
  font-family:'Zpix',monospace;
  font-size:15px;
  color:var(--ink);
  /* 居中就在 body 里做，照 identify.html（已核实能跑的纯 DOM 页）：
     先给 html/body 显式定高，再用 flex 居中。
     **不要**写成 position:fixed —— 那会让 body 脱离文档流，html 的高度跟着塌成 0，
     而 AUI 解析 % 与包含块时要沿族谱取祖先的**已缓存内宽/内高**（Size.getScaleWidth /
     containingBlockPaddingBoxExtent），基准一塌居中就没了。
     也**不要**用 left:50% + 负 margin（坑 3，AUI 不支持那种居中）。
     mode=gui 下文档尺寸恰好等于逻辑视口，所以 100% / vh 都是确定值，不会塌。 */
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  /* padding 只给 .ch-hall 那两层硬投影（16px）留位置，不当居中用 */
  padding:22px;
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}

npc-bar,kingdom-entity-avatar,world-map,img{
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}

/* ============================================================
   外壳：大面板，整块照背包页的 .id-card——
   一张 4:3 的贴图铺满，7 圈边框与内部渐变都由它提供。
   ============================================================ */
.ch-hall{
  position:relative;
  flex:0 0 auto;
  /* AUI 不实现 aspect-ratio，写它在 1080 宽下的精确高度（1080 : 810 = 4:3）【替换 6】
     原：aspect-ratio:4/3; width:min(1080px,96vw,125vh) */
  width:1080px;
  height:810px;
  display:flex;
  flex-direction:column;
  /* 60px：三栏的硬环向外扩 8px，再留出 52px。
     外框贴图本身也占一圈宽度，所以这个值要比看上去的需要更大。 */
  padding:60px;
  background-color:var(--parchment);
  background-image:url('/tex/card_gen.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  box-shadow:
    8px 8px 0 0 rgba(0,0,0,.5),
    16px 16px 0 0 rgba(0,0,0,.28);
}

/* 三个主框紧贴拼成一块：间距为 0，各栏自己带边框。
   因为相邻栏的边界重合，两栏的硬环落在同一位置会完全重叠，
   所以中间看到的是"一条线"，而不是两条——这正是三框共边的效果。
   原稿是 grid repeat(3,minmax(0,1fr))；AUI 的 grid 分栏比例不可靠，
   改 flex:1 1 0——同样是三栏等宽，且能保证共边。【替换 10】 */
.ch-hall-inner{
  flex:1 1 auto;
  min-height:0;
  display:flex;
}

.ch-left,
.ch-mid,
.ch-right{
  flex:1 1 0;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
}

/* 每栏只有一个主框，让它撑满栏高——三个主框才会等高、底边对齐。
   缺了这条，框只会按内容高度收起，三栏高度就各不相同。 */
.ch-left .pane,
.ch-mid .pane,
.ch-right .pane{flex:1 1 auto;min-height:0;}

/* ---------- 右主框内的三个小框 ---------- */
.rbox{
  display:flex;
  flex-direction:column;
  padding:10px 12px;
  background-color:var(--parchment);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 0 0 1px var(--border-light),
    inset 2px 2px 0 0 var(--border-hi),
    inset -2px -2px 0 0 var(--border-mid);
}

.rbox + .rbox{margin-top:16px;}

/* ============================================================
   主框：三栏各是一个完整的面板，8 圈硬环照原稿 .pane。
   栏与栏间距为 0，边界重合，所以相邻的环叠成一条线。
   ============================================================ */
.pane{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:0;
  padding:16px 18px;
  background-color:var(--parchment-hi);
  /* 原稿是 JS 的 buildPaneGrid(48,102)——竖长比例（0.47），与主框同比例。
     不能用 80×60 的横图：纵向会被拉十几倍，颗粒拉成竖条、四周渐暗被扯平。【替换 1】 */
  background-image:url('/tex/pane_v.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  box-shadow:
    0 0 0 2px #2a1a08,
    0 0 0 4px #4a3218,
    0 0 0 6px #6a4a20,
    0 0 0 8px #3a2814,
    inset 0 0 0 2px #8a6e3c,
    inset 2px 2px 0 0 #d8bc8c,
    inset -2px -2px 0 0 #4a3218;
}

.pane-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:8px;
  margin-bottom:12px;
  border-bottom:2px solid var(--border-mid);
  box-shadow:0 1px 0 rgba(255,240,200,.45);
}

.pane-title{
  display:flex;
  align-items:center;
  font-size:15px;
  font-weight:400;
  /* 原稿 .3em；15px × .3 = 4.5 → 4px【替换 9】 */
  letter-spacing:4px;
  text-indent:4px;
  color:var(--ink);
}

/* 标题前的小菱形，照原稿 .pane-title::before */
.pane-title::before{
  content:"";
  display:inline-block;
  flex-shrink:0;
  width:6px;
  height:6px;
  margin-right:9px;
  background:var(--border-mid);
  box-shadow:0 0 0 1px var(--border-deep);
  transform:translateY(-1px) rotate(45deg);
}

.pane-meta{
  flex-shrink:0;
  font-size:11px;
  /* 原稿 .18em；11 × .18 = 1.98 → 2px【替换 9】 */
  letter-spacing:2px;
  color:rgba(74,50,24,.7);
  white-space:nowrap;
}

/* ============================================================
   地图框：网格底 + 内凹硬环，照原稿的 .model-box
   ============================================================ */
/* 地图吃掉栏内剩余空间。栏里多了金库与民情两个框之后，
   它分到的高度自然比原来矮，不用写死数值 */
.pane-map{flex:1 1 auto;min-height:0;}

.ch-map{
  position:relative;
  flex:1 1 auto;
  min-height:120px;
  cursor:grab;
  /* 未探索区块是黑的，所以底色就是黑（覆盖 .model-box 的网格底） */
  background:#000;
}

.ch-map.dragging{cursor:grabbing;}

/* <world-map>：AUI 侧的地图元素，铺满地图框 */
.ch-map world-map{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

.model-box{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  overflow:hidden;
  background-color:rgba(58,40,20,.10);
  background-image:
    linear-gradient(rgba(58,40,20,.10) 1px, transparent 1px),
    linear-gradient(90deg, rgba(58,40,20,.10) 1px, transparent 1px);
  background-size:16px 16px;
  background-position:center center;
  /* 地图框在面板内部，改用原稿 .np-attr 那套「实边 + 内环」：
     不再向外扩，免得和面板自己的 8 环叠成一片 */
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 0 0 1px var(--border-light),
    inset 2px 2px 0 0 var(--border-hi),
    inset -2px -2px 0 0 var(--border-dark);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ============================================================
   金库 / 民情：能量格条，照原稿的 .vital / .vital-bar。
   条身由 <npc-bar> 画（原为 canvas），外框仍是这里的 CSS。
   ============================================================ */
.vitals{
  flex-shrink:0;
  margin-top:10px;
  display:flex;
  flex-direction:column;
}

/* 原稿是 flex gap:10px；AUI 的 flex gap 行为不一致，改 margin【替换 8】 */
.vital + .vital{margin-top:10px;}

.vital{display:flex;flex-direction:column;}

.vital-head{
  display:flex;
  /* 原稿 align-items:baseline；AUI 容器页禁用 baseline（§0 铁律 2），改 center【替换 11】 */
  align-items:center;
  justify-content:space-between;
  /* 原稿是 gap:6px（纵向）；改 margin-bottom【替换 8】 */
  margin-bottom:6px;
}

.vital-label{
  font-size:13px;
  /* 原稿 .28em；13 × .28 = 3.64 → 4px【替换 9】 */
  letter-spacing:4px;
  text-indent:4px;
  color:var(--ink-2);
}

.vital-num{
  display:flex;
  align-items:center;
  flex-shrink:0;
}

.vital-num b{font-size:13px;font-weight:400;color:var(--ink);}
.vital-num i{font-size:13px;font-style:normal;color:rgba(74,50,24,.65);}

.vital-bar{
  position:relative;
  height:22px;
  background-color:var(--border-deep);
  box-shadow:
    0 0 0 2px #2a1a08,
    inset 0 0 0 2px var(--border-mid),
    inset 1px 1px 0 0 var(--border-dark),
    inset -1px -1px 0 0 var(--border-light);
  overflow:hidden;
}

.vital-canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

/* ============================================================
   中栏：城名 / 概况属性卡 / 领地信息
   ============================================================ */
.ch-mid .pane{flex:1 1 auto;}

.town-name{
  font-size:34px;
  line-height:1.2;
  /* 原稿 .22em；34 × .22 = 7.48 → 7px【替换 9】 */
  letter-spacing:7px;
  text-indent:7px;
  color:var(--ink);
  padding-bottom:10px;
}

/* 分隔装饰：虚线 + 正中菱形，照原稿的 .np-sep */
.sep{
  position:relative;
  height:4px;
  flex-shrink:0;
  margin:14px 0 2px;
  background:repeating-linear-gradient(90deg,
    var(--border-mid) 0 3px,
    transparent 3px 6px);
  box-shadow:
    inset 0 1px 0 rgba(255,240,200,.3),
    inset 0 -1px 0 rgba(74,50,24,.45);
}

.sep::before{
  content:"";
  position:absolute;
  left:50%;
  top:-3px;
  width:6px;
  height:6px;
  transform:translateX(-50%) rotate(45deg);
  background:var(--border-mid);
  box-shadow:
    0 0 0 2px var(--border-deep),
    0 0 0 3px var(--parchment);
}

.eyebrow{
  font-size:13px;
  line-height:18px;
  /* 原稿 .4em；13 × .4 = 5.2 → 5px【替换 9】 */
  letter-spacing:5px;
  text-indent:5px;
  color:var(--ink-2);
}

/* 属性卡：照原稿的 .np-attr（74 高 + 2px 实边 + 四层内环） */
.stat-row{
  display:flex;
  flex-shrink:0;
  margin:12px 0 4px;
}

/* 原稿 grid repeat(3,1fr) + gap:12px；改 flex:1 1 0 等宽 + margin【替换 8/10】 */
.stat{
  position:relative;
  flex:1 1 0;
  min-width:0;
  height:74px;
  padding:8px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  text-align:center;
  /* 原稿是 JS 的 buildSmall(48,20,0.80,21)【替换 1】 */
  background-image:url('/tex/card_small.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  background-color:var(--parchment);
  image-rendering:pixelated;
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 0 0 1px var(--border-light),
    inset 2px 2px 0 0 var(--border-hi),
    inset -2px -2px 0 0 var(--border-mid);
  cursor:pointer;
}

.stat + .stat{margin-left:12px;}

.stat:hover{background-color:var(--gold-l);}

.stat-label{
  display:block;
  font-size:12px;
  line-height:14px;
  color:var(--ink-2);
}

.stat-value{
  display:block;
  font-size:18px;
  line-height:20px;
  padding:2px 0;
}

.stat-max{
  display:block;
  font-size:10px;
  line-height:12px;
  color:rgba(74,50,24,.75);
}

/* ---------- 领地信息：每个字段一个小框 ---------- */
.realm-info{
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  margin-top:10px;
}

.realm-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px;
  background-color:var(--parchment);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 0 0 1px var(--border-light),
    inset 2px 2px 0 0 var(--border-hi),
    inset -2px -2px 0 0 var(--border-mid);
}

/* 原稿 gap:10px；改 margin【替换 8】 */
.realm-row + .realm-row{margin-top:10px;}

.realm-k{
  flex-shrink:0;
  font-size:12px;
  line-height:16px;
  /* 原稿 .22em；12 × .22 = 2.64 → 3px【替换 9】 */
  letter-spacing:3px;
  text-indent:3px;
  color:var(--ink-2);
  /* 原稿 .realm-row 的 gap:12px；改 margin【替换 8】 */
  margin-right:12px;
}

.realm-v{
  min-width:0;
  font-size:15px;
  line-height:20px;
  color:var(--ink);
  text-align:right;
  overflow:hidden;
  white-space:nowrap;
}

/* ---------- 右栏三个主框内部的条目行 ---------- */
/* flex-basis 必须是 0，不能是 auto。
   写 auto 时高度会按内容撑开——世界事件有十几条，整页就被拉长了。
   写 0 才是三块均分可用高度，多出来的条目靠滚动看。 */
.rbox--grow{
  flex:1 1 0;
  min-height:0;
  overflow:hidden;
}

.rbox-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  /* 原稿 .rbox 是 gap:8px（纵向）；改 margin-bottom【替换 8】 */
  margin-bottom:8px;
}

.rlines{
  display:flex;
  flex-direction:column;
  /* 同样是 basis 0：条目再多也不是把框撑高，而是自己滚 */
  flex:1 1 0;
  min-height:0;
  overflow-y:auto;
}

/* 像素日历图标：外框 + 顶部一条深色当表头。
   AUI 里跑不了图标字体，用纯 CSS 画一个更稳。 */
.cal-icon{
  flex-shrink:0;
  width:16px;
  height:16px;
  cursor:pointer;
  background-color:var(--parchment);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 4px 0 0 var(--border-mid);
}

.cal-icon:hover{background-color:var(--gold-l);}

/* 三块等分右栏高度 */
.ch-right .pane > .rbox--grow + .rbox--grow{margin-top:12px;}

.rline{
  display:flex;
  /* 原稿 align-items:baseline；同 .vital-head，改 center【替换 11】 */
  align-items:center;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px dotted rgba(74,50,24,.35);
}

.rline:last-child{border-bottom:0;}

.rline-k{
  flex-shrink:0;
  font-size:11px;
  line-height:16px;
  color:rgba(74,50,24,.7);
  /* 原稿 .rline 的 gap:8px；改 margin【替换 8】 */
  margin-right:8px;
}

.rline-v{
  min-width:0;
  font-size:13px;
  line-height:18px;
  color:var(--ink);
  overflow:hidden;
  white-space:nowrap;
}

.kv-val--up{color:#2f5a1c;}
.kv-val--down{color:#7a3a10;}

/* ---------- 空列表提示 ---------- */
.empty-note{
  padding:26px 6px;
  text-align:center;
  font-size:13px;
  line-height:20px;
  color:rgba(74,50,24,.62);
}

/* ============================================================
   像素中世纪滚动条
   ------------------------------------------------------------
   系统默认滚动条是灰色的，跟羊皮纸界面完全不搭。这里用 WebKit
   伪元素重画：槽是内凹的深色，滑块是凸起的亮褐，悬停转金——
   与 .pane / .rbox 同一套「左上高光、右下暗边」的语汇。

   两个注意点：
   · WebKit 伪元素不接受 border，描边只能用 box-shadow 的 0 0 0 Npx；
   · scrollbar-color 会覆盖 ::-webkit-scrollbar，两者不能同时写，
     这里以 WebKit 为准（Firefox 下会退回系统样式）。

   这一份与 theme/pixel-medieval.css 里的 §14 是同一套值，
   页面自包含不能引外部 CSS，所以两边都留了一份。
   ============================================================ */
.scroll{overflow-y:auto;min-height:0;}

.scroll::-webkit-scrollbar{
  width:14px;
  height:14px;
}

/* 槽：深色内凹 */
.scroll::-webkit-scrollbar-track{
  background-color:var(--border-deep);
  box-shadow:
    inset 1px 1px 0 0 #2a1a08,
    inset -1px -1px 0 0 var(--border-mid);
}

/* 滑块：亮褐凸起 */
.scroll::-webkit-scrollbar-thumb{
  background-color:var(--border-light);
  box-shadow:
    0 0 0 1px #2a1a08,
    inset 1px 1px 0 0 var(--border-hi),
    inset -1px -1px 0 0 var(--border-dark);
}

/* 悬停转金 */
.scroll::-webkit-scrollbar-thumb:hover{
  background-color:var(--gold);
  box-shadow:
    0 0 0 1px #2a1a08,
    inset 1px 1px 0 0 var(--gold-l),
    inset -1px -1px 0 0 var(--border-dark);
}

/* 两个方向的交汇角，别留出一块白 */
.scroll::-webkit-scrollbar-corner{
  background-color:var(--border-deep);
}

/* ============================================================
   列表卡片
   ============================================================ */

/* 人口：32 的头像位 + 名字 + 职业/班次 */
.pcard{
  display:flex;
  align-items:center;
  padding:7px 6px;
  border-bottom:1px dotted rgba(74,50,24,.35);
  cursor:pointer;
}

.pcard:last-child{border-bottom:0;}
.pcard:hover{background-color:rgba(201,162,39,.16);}

/* 选中态由 Java 切 .on */
.pcard.on{
  background-color:rgba(201,162,39,.26);
  box-shadow:inset 0 0 0 2px var(--gold);
}

/* 头像位：由 <kingdom-entity-avatar> 贴皮肤上那张 2D 的脸 */
.pcard-avatar{
  flex-shrink:0;
  width:32px;
  height:32px;
  display:block;
  background-color:var(--parchment-lo);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 1px 1px 0 rgba(255,240,200,.35);
  image-rendering:pixelated;
  /* 原稿 .pcard 的 gap:10px；改 margin【替换 8】 */
  margin-right:10px;
}

.pcard-main{flex:1 1 auto;min-width:0;}

.pcard-name{
  font-size:15px;
  line-height:20px;
  color:var(--ink);
  overflow:hidden;
  white-space:nowrap;
}

.pcard-sub{
  font-size:11px;
  line-height:15px;
  color:rgba(74,50,24,.7);
}

/* 建筑：没有头像，只有名称 + 分类 + 坐标 */
.bcard{
  display:flex;
  align-items:center;
  padding:8px 6px;
  border-bottom:1px dotted rgba(74,50,24,.35);
  cursor:pointer;
}

.bcard:last-child{border-bottom:0;}
.bcard:hover{background-color:rgba(201,162,39,.16);}
.bcard.on{
  background-color:rgba(201,162,39,.26);
  box-shadow:inset 0 0 0 2px var(--gold);
}

/* 原稿 .bcard 的 gap:10px；改 margin【替换 8】 */
.bcard-main{flex:1 1 auto;min-width:0;margin-right:10px;}

.bcard-name{
  font-size:15px;
  line-height:20px;
  color:var(--ink);
  overflow:hidden;
  white-space:nowrap;
}

/* 坐标用等宽感呈现，别让它被省略号截掉 */
.bcard-pos{
  flex-shrink:0;
  font-size:11px;
  line-height:15px;
  color:rgba(74,50,24,.72);
}

/* ============================================================
   页内弹窗：盖在面板里的一层小 UI，不切页面。
   默认 display:none，Java 加 .is-open 才显示——
   标记里不预置任何显隐状态。
   ============================================================ */
.modal{
  position:absolute;
  left:0;
  top:0;
  right:0;
  bottom:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(10,6,4,.55);
}

.modal.is-open{display:flex;}

.modal-box{
  display:flex;
  flex-direction:column;
  /* 原稿 width:min(560px,84%); max-height:72%；
     AUI 的 min()/% 不可靠，改固定值【替换 12】 */
  width:560px;
  height:420px;
  padding:14px 16px;
  background-color:var(--parchment-hi);
  /* 原稿是 JS 的 buildSmall【替换 1】 */
  background-image:url('/tex/card_small.png');
  background-size:100% 100%;
  background-repeat:no-repeat;
  image-rendering:pixelated;
  box-shadow:
    0 0 0 2px #2a1a08,
    0 0 0 4px #4a3218,
    0 0 0 6px #6a4a20,
    0 0 0 8px #3a2814,
    inset 0 0 0 2px #8a6e3c,
    inset 2px 2px 0 0 #d8bc8c,
    inset -2px -2px 0 0 #4a3218;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  padding-bottom:8px;
  margin-bottom:10px;
  border-bottom:2px solid var(--border-mid);
  box-shadow:0 1px 0 rgba(255,240,200,.45);
}

.modal-title{
  font-size:15px;
  line-height:20px;
  /* 原稿 .3em；15 × .3 = 4.5 → 4px【替换 9】 */
  letter-spacing:4px;
  text-indent:4px;
  color:var(--ink);
}

/* 关闭按钮：照 .rbox 的语汇做一个小方钮 */
.modal-close{
  flex-shrink:0;
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  line-height:1;
  color:var(--ink);
  cursor:pointer;
  background-color:var(--parchment);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 1px 1px 0 var(--border-hi);
}

.modal-close:hover{background-color:var(--gold-l);}

.modal-search{
  flex-shrink:0;
  margin-bottom:10px;
}

/* 附属地弹窗不需要搜索，由 Java 加这个类藏起来 */
.modal-search.is-hidden{display:none;}

/* 弹窗正文：滚动区 */
.modal-body{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
}

/* 输入框：照原稿 .np-attr 的凹槽语汇 */
.field input{
  width:100%;
  padding:5px 8px;
  font-family:'Zpix',monospace;
  font-size:15px;
  line-height:20px;
  color:var(--ink);
  background-color:var(--parchment-hi);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 1px 1px 0 rgba(0,0,0,.22);
  outline:0;
}

.field input::placeholder{color:rgba(74,50,24,.55);}

/* ============================================================
   日期选择：一格一天，可滚动
   ============================================================ */
/* 原稿 grid repeat(6,1fr) + gap:8px。
   AUI 的 grid 只支持无单位整数当列数（等距阵列），间距用子元素 margin。【替换 8/10】 */
.day-grid{
  display:grid;
  grid-template-columns:6;
}

.day-cell{
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 8px 8px 0;
  font-size:13px;
  line-height:1;
  color:var(--ink);
  cursor:pointer;
  background-color:var(--parchment);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 1px 1px 0 var(--border-hi);
}

.day-cell:hover{background-color:var(--gold-l);}

/* 当前选中的那天由 Java 切 .on */
.day-cell.on{
  background-color:var(--gold);
  color:var(--border-deep);
  box-shadow:
    0 0 0 1px var(--gold),
    inset 1px 1px 0 #fff6cf;
}

/* ============================================================
   全屏地图
   ============================================================ */
.map-full{
  position:absolute;
  left:0;
  top:0;
  right:0;
  bottom:0;
  z-index:25;
  display:none;
  flex-direction:column;
  padding:26px;
  background:rgba(10,6,4,.88);
}

.map-full.is-open{display:flex;}

/* 全屏地图打开时把缩略图撤下：两张图铺的是同一份客户端本地数据，
   同时开着就是把同一块区域画两遍，撤掉一张省一次整屏铺像素。 */
.ch-map.is-hidden{display:none;}

.map-full-box{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  cursor:grab;
  background:#000;
  box-shadow:
    0 0 0 2px #2a1a08,
    0 0 0 4px #4a3218,
    0 0 0 6px #6a4a20,
    0 0 0 8px #3a2814;
}

.map-full-box.dragging{cursor:grabbing;}

.map-full-box world-map{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  display:block;
}

.map-full-hint{
  flex-shrink:0;
  padding-top:10px;
  text-align:center;
  font-size:11px;
  line-height:16px;
  color:rgba(216,188,140,.75);
}

/* 地图框右上角的放大提示：平时淡，悬停才明显 */
.ch-map .map-zoom-hint{
  position:absolute;
  right:4px;
  top:4px;
  z-index:2;
  padding:2px 6px;
  font-size:11px;
  line-height:16px;
  color:rgba(216,188,140,.7);
  background:rgba(10,6,4,.45);
  pointer-events:none;
}

/* ============================================================
   领地等级：据点 → 村落 → 集镇 → 城池 → 城邦
   ------------------------------------------------------------
   五枚徽记横排成一条轨道，节点间用硬线连接。三态：
     · .is-passed  已达成——金底、暗金描边
     · .is-current 当前档——亮纸底 + 金环（两层，画在 box-shadow 上）
     · 默认        未达成——压暗纸底
   节点一律**方形**：本页回避 transform（rotate 的菱形在 AUI 里不可靠），
   装饰语汇与 .pane / .rbox / .realm-row 完全同源。
   轨道用 flex 排、连接线 flex:1 吃剩余宽——不用 grid 分栏、不用 gap。
   ============================================================ */
.tier-track{
  display:flex;
  align-items:center;
  flex-shrink:0;
  margin-top:10px;
}

.tier-node{
  flex:0 0 auto;
  width:48px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  line-height:16px;
  /* 两个字在 flex 居中下会被 letter-spacing 顶偏，用 text-indent 拉回来 */
  letter-spacing:2px;
  text-indent:2px;
  color:rgba(74,50,24,.5);
  background-color:var(--parchment-lo);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px #2a1a08,
    inset 1px 1px 0 rgba(255,240,200,.26),
    inset -1px -1px 0 rgba(58,40,20,.34);
}

/* 已达成：金底 */
.tier-node.is-passed{
  color:#1a1208;
  background-color:var(--gold);
  border-color:#8a6d17;
  box-shadow:
    0 0 0 1px #2a1a08,
    inset 1px 1px 0 var(--gold-l),
    inset -1px -1px 0 #8a6d17;
}

/* 当前档：亮纸 + 金环 */
.tier-node.is-current{
  color:var(--ink);
  background-color:var(--parchment-hi);
  border-color:var(--border-deep);
  box-shadow:
    0 0 0 2px var(--gold),
    inset 2px 2px 0 #fff6cf,
    inset -2px -2px 0 var(--border-mid);
}

.tier-link{
  flex:1 1 auto;
  min-width:6px;
  height:4px;
  background-color:var(--border-dark);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.14);
}

.tier-link.is-passed{
  background-color:var(--gold);
  box-shadow:inset 0 1px 0 var(--gold-l);
}

/* ---------- 当前档 / 下一级：两行小框，照 .realm-row 的语汇 ---------- */
.tier-info{
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  margin-top:10px;
}

.tier-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px;
  background-color:var(--parchment);
  border:2px solid var(--border-dark);
  box-shadow:
    0 0 0 1px var(--border-mid),
    inset 0 0 0 1px var(--border-light),
    inset 2px 2px 0 0 var(--border-hi),
    inset -2px -2px 0 0 var(--border-mid);
}

.tier-row + .tier-row{margin-top:8px;}

.tier-k{
  flex-shrink:0;
  font-size:12px;
  line-height:16px;
  letter-spacing:3px;
  text-indent:3px;
  color:var(--ink-2);
  margin-right:12px;
}

.tier-v{
  min-width:0;
  font-size:14px;
  line-height:18px;
  color:var(--ink);
  text-align:right;
  overflow:hidden;
  white-space:nowrap;
}

/* 人口条件条：直接复用 .vital-head / .vital-bar 的语汇与 <npc-bar> */
.tier-cond{
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  margin-top:10px;
}

.tier-cond.is-max .vital-label,
.tier-cond.is-max .vital-num b,
.tier-cond.is-max .vital-num i{color:var(--gold);}

</style>
</head>
<body>

<div class="ch-hall" id="chHall">
  <div class="ch-hall-inner">

    <!-- ================= 左主框：城镇地图 / 金库 / 民情 ================= -->
    <div class="ch-left">

      <section class="pane pane-map">
        <header class="pane-head">
          <h2 class="pane-title">城 镇 地 图</h2>
          <span class="pane-meta" id="chMapMeta">32 × 32</span>
        </header>

        <!-- 世界地图：像素来自客户端本地缓存（区块加载时逐帧采、落盘在 gameDir/kingdom-client-map），
             Java 侧不发任何地图包。center-x / center-z 是占位，
             打开界面时由 CityHallScreen 填入上次看的位置，没记过就用市政厅方块位置。 -->
        <div class="model-box ch-map" id="chMapBox">
          <world-map id="chMap" center-x="0" center-z="0" radius="192" marker-x="0" marker-z="0"></world-map>
          <span class="map-zoom-hint">点 击 放 大</span>
        </div>

        <div class="sep"></div>

        <div class="eyebrow">金 库</div>

        <div class="vitals">
          <div class="vital">
            <div class="vital-head">
              <span class="vital-label">库存</span>
              <span class="vital-num"><b id="chGoldNow">1240</b><i id="chGoldMax">/2000</i></span>
            </div>
            <div class="vital-bar">
              <npc-bar class="vital-canvas" id="chGoldBar" type="gold" value="1240" max="2000"></npc-bar>
            </div>
          </div>
        </div>

        <div class="sep"></div>

        <div class="eyebrow">民 情</div>

        <!-- 三条的刻画与金库条完全一致，只把计数换成百分比 -->
        <div class="vitals">
          <div class="vital">
            <div class="vital-head">
              <span class="vital-label">凝聚力</span>
              <span class="vital-num"><b id="chUnityNow">76</b><i>%</i></span>
            </div>
            <div class="vital-bar">
              <npc-bar class="vital-canvas" id="chUnityBar" type="mana" value="76" max="100"></npc-bar>
            </div>
          </div>

          <div class="vital">
            <div class="vital-head">
              <span class="vital-label">忠诚度</span>
              <span class="vital-num"><b id="chLoyalNow">82</b><i>%</i></span>
            </div>
            <div class="vital-bar">
              <npc-bar class="vital-canvas" id="chLoyalBar" type="hunger" value="82" max="100"></npc-bar>
            </div>
          </div>

          <div class="vital">
            <div class="vital-head">
              <span class="vital-label">幸福度</span>
              <span class="vital-num"><b id="chHappyNow">68</b><i>%</i></span>
            </div>
            <div class="vital-bar">
              <npc-bar class="vital-canvas" id="chHappyBar" type="hp" value="68" max="100"></npc-bar>
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- ================= 中主框：城镇名 / 概况 / 领地信息 ================= -->
    <div class="ch-mid">
      <section class="pane">

        <h1 class="town-name" id="chTownName">锈 锤 堡</h1>

        <div class="sep"></div>

        <div class="eyebrow">城 镇 概 况</div>

        <!-- 三个方框可点：人口 / 建筑 / 附属各弹出一个列表 -->
        <div class="stat-row">
          <div class="stat" id="chStatPop">
            <span class="stat-label">人口</span>
            <span class="stat-value" id="chPop">48</span>
            <span class="stat-max" id="chPopMax">/ 64</span>
          </div>
          <div class="stat" id="chStatBuild">
            <span class="stat-label">建筑</span>
            <span class="stat-value" id="chBuild">17</span>
            <span class="stat-max" id="chBuildMax">/ 24</span>
          </div>
          <div class="stat" id="chStatVassal">
            <span class="stat-label">附属</span>
            <span class="stat-value" id="chVassal">3</span>
            <span class="stat-max" id="chVassalMax">/ 6</span>
          </div>
        </div>

        <div class="sep"></div>

        <div class="eyebrow">领 地 信 息</div>

        <!-- 四个字段各带一个小框 -->
        <div class="realm-info">
          <div class="realm-row">
            <span class="realm-k">隶 属</span>
            <span class="realm-v" id="chRealmNation">瓦拉里安 · 北境</span>
          </div>
          <div class="realm-row">
            <span class="realm-k">盟 友</span>
            <span class="realm-v" id="chRealmAlly">灰石镇、盐河渡</span>
          </div>
          <div class="realm-row">
            <span class="realm-k">敌 人</span>
            <span class="realm-v" id="chRealmFoe">黑鸦团</span>
          </div>
          <div class="realm-row">
            <span class="realm-k">当前政策</span>
            <span class="realm-v" id="chRealmPolicy">屯田令</span>
          </div>
        </div>

        <div class="sep"></div>

        <div class="eyebrow">领 地 等 级</div>

        <!-- 五级徽记轨道：据点 → 村落 → 集镇 → 城池 → 城邦。
             等级完全由人口推导（初始即据点），节点三态由 Java 切类：
               已达成 → .is-passed，当前档 → .is-current，未达成 → 不切。
             连接线同理切 .is-passed。结构里不预置任何状态。 -->
        <div class="tier-track" id="chTierTrack">
          <div class="tier-node" id="chTierNode0">据点</div>
          <div class="tier-link" id="chTierLink0"></div>
          <div class="tier-node" id="chTierNode1">村落</div>
          <div class="tier-link" id="chTierLink1"></div>
          <div class="tier-node" id="chTierNode2">集镇</div>
          <div class="tier-link" id="chTierLink2"></div>
          <div class="tier-node" id="chTierNode3">城池</div>
          <div class="tier-link" id="chTierLink3"></div>
          <div class="tier-node" id="chTierNode4">城邦</div>
        </div>

        <div class="tier-info">
          <div class="tier-row">
            <span class="tier-k">当 前</span>
            <span class="tier-v" id="chTierNow">据点</span>
          </div>
          <div class="tier-row">
            <span class="tier-k">下 一 级</span>
            <span class="tier-v" id="chTierNext">村落 · 需 24 人口</span>
          </div>
        </div>

        <!-- 人口条件：满档时 Java 给 .tier-cond 加 .is-max，整行转金 -->
        <div class="tier-cond" id="chTierCond">
          <div class="vital-head">
            <span class="vital-label">人口条件</span>
            <span class="vital-num"><b id="chTierPopNow">48</b><i id="chTierPopNeed">/ 24</i></span>
          </div>
          <div class="vital-bar">
            <npc-bar class="vital-canvas" id="chTierPopBar" type="gold" value="48" max="24"></npc-bar>
          </div>
        </div>

      </section>
    </div>

    <!-- ================= 右主框：世界事件 / 政务处理 / 资金流水 ================= -->
    <div class="ch-right">

      <section class="pane">

        <!-- 三块等分栏高；条目由 Java 注入，容器自己滚 -->
        <div class="rbox rbox--grow">
          <div class="rbox-head">
            <div class="eyebrow">世 界 事 件</div>
            <span class="cal-icon" id="chCalBtn"></span>
          </div>
          <div class="rlines scroll" id="chEventList"></div>
        </div>

        <div class="rbox rbox--grow">
          <div class="rbox-head">
            <div class="eyebrow">政 务 处 理</div>
          </div>
          <div class="rlines scroll" id="chTodoList"></div>
        </div>

        <div class="rbox rbox--grow">
          <div class="rbox-head">
            <div class="eyebrow">资 金 流 水</div>
          </div>
          <div class="rlines scroll" id="chLedgerList"></div>
        </div>

      </section>

    </div>

  </div>

  <!-- ===================== 页内弹窗层 =====================
       全部盖在面板内部，不切页面。默认由 CSS 隐藏，
       Java 按需要加 .is-open。标记里不写任何显隐状态。 -->

  <!-- 通用列表弹窗：人口 / 建筑 / 附属三个共用这一个，
       标题、搜索框显隐、内容都由 Java 填 -->
  <div class="modal" id="chModal">
    <div class="modal-box">
      <header class="modal-head">
        <span class="modal-title" id="chModalTitle">—</span>
        <span class="modal-close" id="chModalClose">✕</span>
      </header>
      <div class="modal-search field" id="chModalSearchWrap">
        <input type="text" id="chModalSearch" placeholder="搜索…">
      </div>
      <div class="scroll modal-body" id="chModalBody"></div>
    </div>
  </div>

  <!-- 日期选择：一格一天，可滚动 -->
  <div class="modal" id="chModalDay">
    <div class="modal-box">
      <header class="modal-head">
        <span class="modal-title" id="chModalDayTitle">选 择 日 期</span>
        <span class="modal-close" id="chModalDayClose">✕</span>
      </header>
      <div class="scroll modal-body">
        <div class="day-grid" id="chDayGrid"></div>
      </div>
    </div>
  </div>

  <!-- 全屏地图 -->
  <div class="map-full" id="chMapFull">
    <div class="map-full-box" id="chMapFullBox">
      <world-map id="chMapFullView" center-x="0" center-z="0" radius="320" marker-x="0" marker-z="0"></world-map>
    </div>
    <div class="map-full-hint">拖 动 平 移　·　滚 轮 缩 放　·　点 击 外 侧 关 闭</div>
  </div>

</div>

</body>
</html>
